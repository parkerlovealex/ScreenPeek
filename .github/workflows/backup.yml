name: Private daily backup
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenpeek-private-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.SCREENPEEK_BACKUP_ENABLED == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund
      - name: Export D1 and config into private R2; retain 14 snapshots
        env:
          SCREENPEEK_BACKUP_ENABLED: ${{ vars.SCREENPEEK_BACKUP_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'posters' }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          BACKUP_BUCKET_PRIVATE: ${{ vars.BACKUP_BUCKET_PRIVATE }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: npm run backup:run
