name = "screenpeek"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]

# Replace IDs with the resources you create; these are local-only placeholders.
[[d1_databases]]
binding = "DB"
database_name = "movie-db"
database_id = "00000000-0000-0000-0000-000000000001"

[[kv_namespaces]]
binding = "CONFIG"
id = "00000000000000000000000000000001"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "posters"

[vars]
SITE_NAME = "ScreenPeek"
ADS_ENABLED = "0"
